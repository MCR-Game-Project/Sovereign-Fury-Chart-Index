<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sovereign Fury — Chart Index</title>
<style>html,body{margin:0;height:100%;background:#150f08;color:#f0d9a0;font:18px Georgia,serif}#boot{padding:28px}</style>
</head>
<body>
<div id="boot">Loading the chart…</div>
<script>
(async function(){
  var n=14, boot=document.getElementById("boot");
  var bases=[
    "https://raw.githubusercontent.com/MCR-Game-Project/Sovereign-Fury-Chart-Index/main/",
    "https://cdn.jsdelivr.net/gh/MCR-Game-Project/Sovereign-Fury-Chart-Index@main/"
  ];
  async function loadFrom(base){
    var parts=await Promise.all(Array.from({length:n},function(_,i){
      return fetch(base+"chunk-"+i+".txt?v=yt5",{cache:"no-store"}).then(function(r){
        if(!r.ok) throw new Error("chunk "+i);
        return r.text();
      });
    }));
    return parts.join("");
  }
  try{
    var html=null, i, err;
    for(i=0;i<bases.length && !html;i++){
      try{ html=await loadFrom(bases[i]); }catch(e){ err=e; }
    }
    if(!html) throw err||new Error("load");
    var url=URL.createObjectURL(new Blob([html],{type:"text/html"}));
    location.replace(url+(location.hash||""));
  }catch(e){
    if(boot) boot.textContent="Could not load the chart. Try this page again in a moment.";
  }
})();
</script>
</body>
</html>
