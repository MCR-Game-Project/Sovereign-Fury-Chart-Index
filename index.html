<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sovereign Fury — Chart Index</title>
<style>html,body{margin:0;height:100%;background:#150f08;color:#f0d9a0;font:18px Georgia,serif}#boot{padding:28px}</style>
</head>
<body>
<div id="boot">Loading the chart…</div>
<script>
(async function(){
  var n=12, boot=document.getElementById("boot");
  try{
    var parts=await Promise.all(Array.from({length:n},function(_,i){
      return fetch("chunk-"+i+".txt?v=north").then(function(r){
        if(!r.ok) throw new Error("chunk "+i);
        return r.text();
      });
    }));
    document.open();
    document.write(parts.join(""));
    document.close();
  }catch(e){
    if(boot) boot.textContent="Could not load the chart. Try this page again in a moment.";
  }
})();
</script>
</body>
</html>
