<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sovereign Fury — Chart Index</title>
<style>
  :root{
    --wood:#241a10; --brass:#c99a45; --brass-d:#8a6a2a; --parch:#ece1c6; --parch2:#e2d4b2;
    --line:#c9b98f; --ink:#2c2214; --ink2:#5c4e33; --muted:#7a6c4e;
    --ui:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

    --water:#7ea0c4; --water-d:#4d6f93;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#150f08;color:var(--ink);font-family:var(--body)}
  .app{height:100%;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:0 0 auto;
       background:linear-gradient(#2f2314,#241a10);padding:8px 14px;
       border-bottom:2px solid var(--brass-d);color:#f0d9a0}
  .title{font-family:var(--serif);font-size:16px;font-weight:600}
  .tag{font:700 9px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#241a10;
       background:var(--brass);border-radius:3px;padding:3px 7px}
  .sub{font:12px var(--serif);color:#cdbf98;font-style:italic}
  .spacer{margin-left:auto}
  .btn{background:#3a2c18;border:1px solid #5a4826;color:#e7dcc0;border-radius:5px;height:26px;padding:0 11px;
       cursor:pointer;font-size:12px;font-family:var(--ui)}
  .btn:hover{border-color:var(--brass);color:#f6e6b8}
  .stagewrap{flex:1;position:relative;min-height:0;background:#d8cba8}
  #cv{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #cv.panning{cursor:grabbing}
  .status{display:flex;align-items:center;gap:18px;flex-wrap:wrap;flex:0 0 auto;
          background:linear-gradient(#2f2314,#241a10);border-top:2px solid var(--brass-d);
          padding:6px 14px;color:#ece1c6;font:12px var(--ui)}
  .status b{color:#f0d9a0}
  .muted{color:#9c8f72}
</style>
</head>

    ctx.strokeStyle="rgba(45,74,99,.35)";
    ctx.lineWidth=Math.max(0.6, Math.min(1.8, 0.04*cam.scale));
    for(i=0;i<LAKES.length;i++){
      drawPath(LAKES[i].pts, true);
      ctx.fill();
      ctx.stroke();
    }

    ctx.strokeStyle="#3d6a8a";
    ctx.lineWidth=Math.max(1.5, Math.min(6, 0.16*cam.scale));
    ctx.lineCap="round"; ctx.lineJoin="round";
    for(i=0;i<RIVERS.length;i++){ drawPath(RIVERS[i].pts, false); ctx.stroke(); }

    ctx.fillStyle="rgba(28,52,72,.78)";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(i=0;i<WATER_LABELS.length;i++){
      lab=WATER_LABELS[i];
      if(cam.scale<lab.z*3.2 && lab.z>0) continue;
      var lw=lonlatToWorld(lab.lon, lab.lat), ls=worldToScreen(lw.x, lw.y);
      ctx.font=(lab.z===0?'italic 13px ':'italic 11px ')+'"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';
      ctx.fillText(lab.name, ls.x, ls.y);
    }

    for(i=0;i<SHEETS.length;i++){
      s=SHEETS[i]; b=sheetWorld(s);
      a=worldToScreen(b.x0,b.y1); c=worldToScreen(b.x1,b.y0);
      var x=Math.min(a.x,c.x), y=Math.min(a.y,c.y), w=Math.abs(c.x-a.x), h=Math.abs(c.y-a.y);
      ctx.fillStyle=s.fill;
      ctx.strokeStyle=s===hover? "#8a3320" : (s.kind==="site"?"#8a3320":"#8a6a2a");
      ctx.lineWidth=s===hover?2.4:(s.kind==="site"?1.8:1.4);
      ctx.fillRect(x,y,w,h);
      ctx.strokeRect(x+0.5,y+0.5,Math.max(1,w-1),Math.max(1,h-1));
      drawHexes(s);
      if(w<8 || h<8){
        pin=worldToScreen((b.x0+b.x1)/2,(b.y0+b.y1)/2);
        ctx.fillStyle="#8a3320";
        ctx.beginPath(); ctx.arc(pin.x, pin.y, cam.scale<1?3:4.5, 0, Math.PI*2); ctx.fill();
        if(cam.scale>=1){
        ctx.fillStyle="#2c2214";
        ctx.font='700 11px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';
        ctx.textAlign="left"; ctx.textBaseline="middle";
        ctx.fillText(s.id+" · "+s.name, pin.x+8, pin.y);
        }
      } else {
        ctx.fillStyle="#2c2214";
        ctx.textAlign="center";
        ctx.textBaseline="middle";
        if(w>54){
          ctx.font='700 12px ui-monospace,"SF Mono",Menlo,Consolas,monospace';
          ctx.fillText(s.id, x+w/2, y+h/2-7);
          ctx.font='italic 11px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';
          ctx.fillText(s.name, x+w/2, y+h/2+8);
        } else {
          ctx.font='700 9px ui-monospace,"SF Mono",Menlo,Consolas,monospace';
          ctx.fillText(s.id, x+w/2, y+h/2);
        }
      }
    }

    for(i=0;i<PLACES.length;i++){
      var pl=PLACES[i];
      if(pl.z>0 && cam.scale<Math.max(0.8, pl.z*2.4)) continue;
      var pw=lonlatToWorld(pl.lon, pl.lat);
      var ps=worldToScreen(pw.x,pw.y);
      ctx.fillStyle="#2c2214";
      ctx.beginPath(); ctx.arc(ps.x, ps.y, pl.z===0?2.6:2.2, 0, Math.PI*2); ctx.fill();
      if(pl.z===0 || cam.scale>=Math.max(2.2, pl.z*3)){
        ctx.font=(pl.z===0?'italic 12px ':'italic 11px ')+'"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';
        ctx.textAlign="left"; ctx.textBaseline="bottom";
        ctx.fillText(pl.name, ps.x+5, ps.y-3);
      }
    }

    var barMi=niceMiles(110), barPx=barMi*cam.scale, bx=W-24-barPx, by=H-22;
    ctx.strokeStyle="#2c2214"; ctx.fillStyle="#2c2214"; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+barPx,by); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx,by-4); ctx.lineTo(bx,by+4); ctx.moveTo(bx+barPx,by-4); ctx.lineTo(bx+barPx,by+4); ctx.stroke();
    ctx.font='700 10px ui-monospace,"SF Mono",Menlo,Consolas,monospace';
    ctx.textAlign="center"; ctx.textBaseline="bottom";
    ctx.fillText(barMi>=1? (barMi+" mi") : (Math.round(barMi*1760)+" yd"), bx+barPx/2, by-6);

    ctx.font='700 11px "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif';
    ctx.textAlign="left"; ctx.textBaseline="top";
    ctx.fillText("N", 18, 16);
    ctx.beginPath(); ctx.moveTo(22,34); ctx.lineTo(22,52); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(22,34); ctx.lineTo(18,40); ctx.lineTo(26,40); ctx.closePath(); ctx.fill();
  }
  function setStatus(s){
    var place=document.getElementById("statplace");
    var size=document.getElementById("statsize");
    var hex=document.getElementById("stathex");
    if(!s){
      place.innerHTML="<b>Place</b> —";
      size.innerHTML="<b>Size</b> —";
      hex.innerHTML="<b>Hexes</b> —";
      return;
    }
    place.innerHTML="<b>Place</b> "+s.id+" · "+s.name;
    size.innerHTML="<b>Size</b> "+s.hex.miW.toFixed(2)+" × "+s.hex.miH.toFixed(2)+" mi";
    hex.innerHTML="<b>Hexes</b> "+s.hex.cols+" × "+s.hex.rows+" · "+YDS+" yd/hex";
  }

  cv.addEventListener("pointerdown", function(ev){
    panning=true; panMoved=false; lastPan={x:ev.clientX,y:ev.clientY}; cv.classList.add("panning");
    cv.setPointerCapture(ev.pointerId);
  });
  cv.addEventListener("pointermove", function(ev){
    var r=cv.getBoundingClientRect(), x=ev.clientX-r.left, y=ev.clientY-r.top;
    if(panning && lastPan){
      var dx=ev.clientX-lastPan.x, dy=ev.clientY-lastPan.y;
      if(Math.abs(dx)+Math.abs(dy)>3) panMoved=true;
      cam.x-=dx/cam.scale;
      cam.y+=dy/cam.scale;
      lastPan={x:ev.clientX,y:ev.clientY};
      draw();
    } else {
      hover=hitSheet(x,y);
      setStatus(hover);
      draw();
    }
  });
  function endPan(ev){
    if(panning && ev.type==="pointerup" && !panMoved){
      var r=cv.getBoundingClientRect(), s=hitSheet(ev.clientX-r.left, ev.clientY-r.top);
      if(s){ fitSheets([s], 0.35); setStatus(s); }
    }
    panning=false; lastPan=null; panMoved=false; cv.classList.remove("panning");
  }
  cv.addEventListener("pointerup", endPan);
  cv.addEventListener("pointercancel", endPan);
  cv.addEventListener("wheel", function(ev){
    ev.preventDefault();
    var r=cv.getBoundingClientRect();
    zoomAt(ev.clientX-r.left, ev.clientY-r.top, ev.deltaY<0?1.18:1/1.18);
  }, {passive:false});

  function fitLonlats(pts, pad){
    var i, p, x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    for(i=0;i<pts.length;i++){
      p=lonlatToWorld(pts[i][0], pts[i][1]);
      if(p.x<x0) x0=p.x; if(p.y<y0) y0=p.y;
      if(p.x>x1) x1=p.x; if(p.y>y1) y1=p.y;
    }
    pad=pad==null?40:pad;
    x0-=pad; y0-=pad; x1+=pad; y1+=pad;
    var W=stage.clientWidth, H=stage.clientHeight;
    cam.x=(x0+x1)/2; cam.y=(y0+y1)/2;
    cam.scale=Math.max(MIN_SCALE, Math.min(80, Math.min(W/(x1-x0), H/(y1-y0))*0.92));
    draw();
  }
  function fitAll(){
    /* NM west · Chicago · Boston · South Texas · Key West */
    fitLonlats([
      [-109.40, 31.33],
      [-109.05, 36.99],
      [-87.6298, 41.8781],
      [-71.0589, 42.3601],
      [-69.40, 42.20],
      [-81.7799, 24.5551],
      [-97.4975, 25.9017]
    ], 60);
  }
  document.getElementById("fitall").onclick=fitAll;
  document.getElementById("fitdc").onclick=function(){
    fitSheets(SHEETS.filter(function(s){ return s.kind==="plate"; }), 2);
  };
  document.getElementById("fityt").onclick=function(){
    var s=SHEETS.filter(function(x){ return x.id==="YT-00"; })[0];
    fitSheets([s], 0.35); setStatus(s);
  };
  document.getElementById("fitpr").onclick=function(){
    var s=SHEETS.filter(function(x){ return x.id==="PR-00"; })[0];
    fitSheets([s], 0.35); setStatus(s);
  };
  document.getElementById("zoomin").onclick=function(){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1.25); };
  document.getElementById("zoomout").onclick=function(){ zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1/1.25); };

  window.addEventListener("resize", resize);
  resize();
  fitAll();
})();
</script>
</body>
